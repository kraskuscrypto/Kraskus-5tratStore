appId: kraskus-compatibility
status: beta
developer: Kraskus Crypto
appVersion: 0.1.5-beta
notes:
  - One-time compatibility helper for Kraskus custom-store app lifecycle support.
  - Mounts only /usr/local/bin/5tratumos as writable host state required for the repair.
  - Mounts /etc/5tratumos/store.json read-only to verify configured custom-store channels.
  - Stores the pre-change backup in this app's persistent data directory.
  - Does not mount the Docker socket and is not privileged.
  - Newer compatible systems and previously repaired systems are no-op paths.
  - Unknown CLI layouts are refused without modifying the host.
  - If shell syntax validation fails after a repair, the original CLI is restored automatically.
releaseNotes:
  - Fixes a false-positive compatibility result on affected 5tratumOS versions where store sync accepts dynamic custom channels but the app update path still rejects them.
  - Verifies the actual app lifecycle channel-validation path before showing the compatibility-complete screen.
  - Repairs the known stale app update and stored-metadata channel validation block.
  - Adds post-repair verification and automatically restores the original CLI if the complete lifecycle repair cannot be proven.
  - Keeps the dedicated compatibility UI on port 18403 and the completion message: Thank you for updating. You may now uninstall this app.
