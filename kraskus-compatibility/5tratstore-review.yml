appId: kraskus-compatibility
status: beta
developer: Kraskus Crypto
appVersion: 0.1.4-beta
notes:
  - One-time compatibility helper for Kraskus custom-store app lifecycle support.
  - Mounts only /usr/local/bin/5tratumos as writable host state required for the repair.
  - Mounts /etc/5tratumos/store.json read-only to verify configured custom-store channels.
  - Stores the pre-change backup in this app's persistent data directory.
  - Does not mount the Docker socket and is not privileged.
  - Newer compatible systems and previously repaired systems are no-op paths.
  - Unknown CLI layouts are refused without modifying the host.
  - If shell syntax validation fails after a repair, the original CLI is restored automatically.
releaseNotes:
  - Fixes Docker Compose interpolation of literal shell variables embedded in the self-contained compatibility runtime.
  - Escapes only the embedded compatibility-script variables while preserving normal APP_DATA_DIR interpolation.
  - Keeps the dedicated compatibility UI on port 18403.
  - Keeps the Kraskus Compatibility launcher icon and completion message: Thank you for updating. You may now uninstall this app.
  - Compatibility repair behavior and safety controls are unchanged.
