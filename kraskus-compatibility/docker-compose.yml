services:
  app_proxy:
    environment:
      APP_HOST: compatibility
      APP_PORT: 18403

  compatibility:
    image: ghcr.io/kraskuscrypto/kraskus-zec-solo@sha256:9ac6eabf4ebed6b0474b9d37d3cc241a6a0259a26b3b3c88df37d00607976db4
    restart: unless-stopped
    entrypoint:
      - python3
      - -c
      - "import os; exec(os.environ['COMPAT_SCRIPT'])"
    environment:
      PORT: "18403"
      COMPAT_SCRIPT: |
        import json, os, shutil, subprocess, time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from pathlib import Path

        CLI = Path('/host/5tratumos')
        STORE = Path('/host/store.json')
        DATA = Path('/data')
        PORT = int(os.environ.get('PORT', '18403'))

        OLD = '''        case "$${ch}" in
          main|dev|global|custom1|custom2) ;;
          *) die "invalid channel: $${ch}" ;;
        esac

        meta_ch=""
        case "$${meta_channel}" in
          main|dev|global|custom1|custom2) meta_ch="$${meta_channel}" ;;
        esac
        '''

        NEW = '''        configured_custom_store() {
          local slot="$${1:-}"

          python3 - "$${slot}" "$${STORE_CONFIG_FILE}" <<'PYCFG'
        import json
        import sys

        slot = (sys.argv[1] if len(sys.argv) > 1 else "").strip().lower()
        path = sys.argv[2] if len(sys.argv) > 2 else ""

        if not slot or not path:
            sys.exit(1)

        try:
            with open(path, "r", encoding="utf-8") as fh:
                data = json.load(fh)
        except Exception:
            sys.exit(1)

        custom = data.get("custom") if isinstance(data, dict) else {}
        entry = custom.get(slot) if isinstance(custom, dict) else None

        if not isinstance(entry, dict):
            sys.exit(1)

        url = str(entry.get("url") or "").strip()
        sys.exit(0 if url else 1)
        PYCFG
        }

        case "$${ch}" in
          main|dev|global)
            ;;
          custom*)
            configured_custom_store "$${ch}" ||
              die "invalid channel: $${ch}"
            ;;
          *)
            die "invalid channel: $${ch}"
            ;;
        esac

        meta_ch=""
        case "$${meta_channel}" in
          main|dev|global)
            meta_ch="$${meta_channel}"
            ;;
          custom*)
            if configured_custom_store "$${meta_channel}"; then
              meta_ch="$${meta_channel}"
            fi
            ;;
        esac
        '''

        status = {'state':'CHECKING','detail':'Checking this 5tratumOS installation.'}

        def set_status(state, detail, backup=''):
            status.update(state=state, detail=detail, backup=backup)
            DATA.mkdir(parents=True, exist_ok=True)
            (DATA/'status.json').write_text(json.dumps(status, indent=2), encoding='utf-8')

        def run_fix():
            try:
                if not CLI.is_file():
                    set_status('FAIL', 'The 5tratumOS host CLI was not available. No changes were made.')
                    return
                text = CLI.read_text(encoding='utf-8')
                full_compatibility = (
                    'configured_custom_store()' in text
                    and 'configured_custom_store "$${ch}"' in text
                    and 'configured_custom_store "$${meta_channel}"' in text
                    and OLD not in text
                )
                if full_compatibility:
                    set_status(
                        'READY',
                        'Compatibility is already installed and the app lifecycle path supports dynamic custom-store channels.'
                    )
                    return
                if OLD not in text:
                    set_status(
                        'FAIL',
                        'Unsupported or partially compatible 5tratumOS CLI layout. The app lifecycle path was not proven compatible, so the host was left unchanged.'
                    )
                    return
                if not STORE.is_file():
                    set_status('FAIL', 'Custom store configuration was not available. The host was left unchanged.')
                    return
                try:
                    cfg = json.loads(STORE.read_text(encoding='utf-8'))
                    custom = cfg.get('custom', {}) if isinstance(cfg, dict) else {}
                    if not isinstance(custom, dict) or not any(isinstance(v, dict) and v.get('url') for v in custom.values()):
                        raise ValueError('no configured custom store')
                except Exception:
                    set_status('FAIL', 'Custom store configuration could not be verified. The host was left unchanged.')
                    return
                DATA.mkdir(parents=True, exist_ok=True)
                stamp = time.strftime('%Y%m%d-%H%M%S', time.gmtime())
                backup = DATA / ('5tratumos.pre-kraskus-compat-' + stamp)
                shutil.copy2(CLI, backup)
                CLI.write_text(text.replace(OLD, NEW, 1), encoding='utf-8')
                check = subprocess.run(['/bin/bash','-n',str(CLI)], capture_output=True, text=True)
                if check.returncode != 0:
                    shutil.copy2(backup, CLI)
                    set_status('FAIL', 'Validation failed, so the original 5tratumOS CLI was restored automatically.', str(backup))
                    return
                repaired = CLI.read_text(encoding='utf-8')
                complete = (
                    'configured_custom_store()' in repaired
                    and 'configured_custom_store "$${ch}"' in repaired
                    and 'configured_custom_store "$${meta_channel}"' in repaired
                    and OLD not in repaired
                )
                if not complete:
                    shutil.copy2(backup, CLI)
                    set_status(
                        'FAIL',
                        'Post-repair app lifecycle validation failed, so the original 5tratumOS CLI was restored automatically.',
                        str(backup)
                    )
                    return
                set_status('READY', 'Compatibility update completed successfully.', str(backup))
            except Exception as exc:
                set_status('FAIL', 'Compatibility setup failed safely: ' + str(exc))

        run_fix()

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == '/status.json':
                    body = json.dumps(status).encode()
                    self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Cache-Control','no-store'); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body); return
                ready = status['state'] == 'READY'
                if ready:
                    message = 'Thank you for updating. You may now uninstall this app.'
                    sub = 'Compatibility setup is complete.'
                    accent = '#3ee98b'
                else:
                    message = 'Compatibility setup needs attention.'
                    sub = status['detail']
                    accent = '#ffbf5f'
                page = '''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kraskus Compatibility</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#102a47 0,#06111e 32%,#02060b 70%);color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;display:grid;place-items:center}.card{width:min(980px,calc(100% - 40px));padding:42px;border:1px solid #0d72c9;border-radius:26px;background:rgba(2,9,17,.9);box-shadow:0 0 80px rgba(0,138,255,.18);text-align:center}.logo{width:min(310px,55vw);height:auto;filter:drop-shadow(0 0 24px rgba(0,160,255,.35))}.brand{font-size:clamp(28px,5vw,58px);font-weight:900;letter-spacing:.12em;margin:14px 0 0}.compat{font-size:clamp(16px,2.5vw,28px);letter-spacing:.35em;color:#159cff;margin:4px 0 30px}.status{margin:0 auto;max-width:760px;padding:24px;border:1px solid #1769a8;border-radius:18px;background:#06131f}.check{font-size:48px;color:ACCENT}.message{font-size:clamp(22px,3vw,34px);font-weight:800;margin:10px 0}.sub{font-size:18px;color:#9fc2e0;margin:0}</style></head><body><main class="card"><img class="logo" src="https://raw.githubusercontent.com/kraskuscrypto/Kraskus-5tratStore/main/kraskus-compatibility/assets/kraskus-compatibility-logo.svg" alt="Kraskus Compatibility"><div class="brand">KRASKUS</div><div class="compat">COMPATIBILITY</div><section class="status"><div class="check">CHECK</div><div class="message">MESSAGE</div><p class="sub">SUB</p></section></main></body></html>'''
                page = page.replace('ACCENT', accent).replace('CHECK', '✓' if ready else '!').replace('MESSAGE', message).replace('SUB', sub)
                body = page.encode()
                self.send_response(200); self.send_header('Content-Type','text/html; charset=utf-8'); self.send_header('Cache-Control','no-store'); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
            def log_message(self, *args):
                pass

        print('Kraskus Compatibility UI listening on 0.0.0.0:%d' % PORT, flush=True)
        ThreadingHTTPServer(('0.0.0.0', PORT), Handler).serve_forever()
    volumes:
      - /usr/local/bin/5tratumos:/host/5tratumos
      - /etc/5tratumos/store.json:/host/store.json:ro
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
