id: kraskus-chta-solo
name: Kraskus CHTA Solo
tagline: CheetahCoin full node and solo mining pool
description: >-
  Kraskus CHTA Solo turns 5tratumOS into a self-contained
  CheetahCoin full node and local solo mining appliance. The
  application manages first-run RPC credentials, node
  synchronization, payout configuration, mining readiness,
  worker connections, CKPool solo mining, and confirmed block
  tracking from one interface. RPC credentials are generated
  locally during installation and remain in persistent app
  storage. CKPool does not start mining until a payout address
  has been configured and validated.
version: 0.2.7-beta
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-5tratStore
support: https://kraskuscrypto.com/
icon: assets/divinity-chta-logo.png
port: 33064
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 18412
