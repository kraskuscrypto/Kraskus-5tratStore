id: kraskus-chta-solo
name: Kraskus CHTA Solo
tagline: CheetahCoin full node and solo mining pool
description: >-
  Kraskus CHTA Solo turns 5tratumOS into a self-contained
  CheetahCoin full node, native wallet, and local solo mining
  appliance. The application manages node synchronization,
  CKPool solo mining, worker connections, native or external
  mining payout selection, confirmed block tracking, wallet
  balances, receive addresses, local QR codes, transaction
  history, and password-gated sending from one interface. RPC
  credentials and wallet authorization state are created and
  retained locally in persistent app storage. CKPool does not
  start mining until a valid payout destination is configured.
version: 0.2.32-dev4
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Dev-Store
support: https://kraskuscrypto.com/
icon: assets/divinity-chta-logo.png
port: 33064
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 18412
