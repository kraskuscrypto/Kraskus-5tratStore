notes: >-
  Backend V2 passed deterministic startup recovery, full-stack
  container restart, and full guest-VM reboot qualification on
  2026-08-24. The exact qualified application images were published
  to GHCR without rebuilding them. The qualified CheetahCoin Core
  image reuses its existing immutable Kraskus GHCR digest. The
  qualified CKPool image is exactly the existing immutable WillItMod
  artifact and is referenced directly rather than mirrored. Runtime
  RPC credentials are generated locally at first installation. TCP
  3336 is exposed for Stratum miners. The application HTTP interface
  is accessed through native 5tratumOS app_proxy. Store-specific
  lifecycle qualification has been exercised on the 0.2.9-beta
  baseline. Version 0.2.15-beta preserves the prefixed overview
  bootstrap and closes a DOM timing race: when the Connect builder
  appears after overview state is already available, the pre-paint
  observer explicitly re-queues the compatibility apply until the
  adapted notes are present. Review remains proposed pending targeted
  browser visual requalification.
