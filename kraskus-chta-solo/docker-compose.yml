services:

  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 18412


  init:
    image: ghcr.io/kraskuscrypto/kraskus-chta-solo@sha256:ecd132f97d5c7957dabc80e18eaa4517d87ee9f033d7b01b5d401e74dc515528
    restart: "no"
    user: "0:0"
    command:
      - python3
      - /qualification/init_config_v2.py
    volumes:
      - ${APP_DATA_DIR}/data/init_config_v2.py:/qualification/init_config_v2.py:ro
      - ${APP_DATA_DIR}/config:/kraskus-config
      - ${APP_DATA_DIR}/secrets:/run/secrets
      - ${APP_DATA_DIR}/pool:/ckpool-data
      - ${APP_DATA_DIR}/node:/node-data
    security_opt:
      - no-new-privileges:true

  cheetahcoin:
    image: ghcr.io/kraskuscrypto/kraskus-cheetahcoin-core@sha256:072f124dcbcff225733a0248f14689edafd1bedd402798f2d677dd4515fcd321
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      - -datadir=/data
      - -conf=/kraskus-config/cheetahcoin.conf
    volumes:
      - ${APP_DATA_DIR}/node:/data
      - ${APP_DATA_DIR}/config:/kraskus-config:ro
    networks:
      - chta
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/local/bin/cheetahcoin-cli -datadir=/data -conf=/kraskus-config/cheetahcoin.conf getblockchaininfo >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true

  pool:
    image: ghcr.io/willitmod/docker-ckpool-solo@sha256:8a9a7f10c8138d0f55533132ee7710a06715a42a49f75efb39be3350ada4fa6e
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      cheetahcoin:
        condition: service_healthy
    ports:
      - "3336:3333"
    volumes:
      - ${APP_DATA_DIR}/config:/kraskus-config:ro
      - ${APP_DATA_DIR}/pool:/www
      - ${APP_DATA_DIR}/data/ckpool-entrypoint-v2.sh:/kraskus-entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - /kraskus-entrypoint.sh
    networks:
      - chta
    security_opt:
      - no-new-privileges:true

  kraskus:
    image: ghcr.io/kraskuscrypto/kraskus-chta-solo@sha256:e0cdd6eaddedb9fc620ae07f6e75dea5722a2490779dae33218b050a7ab6a133
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      cheetahcoin:
        condition: service_healthy
      pool:
        condition: service_started

    environment:
      KRASKUS_API_HOST: 0.0.0.0
      KRASKUS_API_PORT: "18411"
      KRASKUS_APP_NAME: Kraskus CHTA Solo
      KRASKUS_APP_VERSION: v2-stage6-candidate3
      KRASKUS_CHTA_RPC_URL: http://cheetahcoin:8536/
      KRASKUS_CHTA_RPC_USER_FILE: /run/secrets/rpc-user
      KRASKUS_CHTA_RPC_PASSWORD_FILE: /run/secrets/rpc-password
      KRASKUS_CHTA_SHARELOG_DIR: /ckpool-data
      KRASKUS_CHTA_USERS_DIR: /ckpool-data/users
      KRASKUS_CHTA_SETTINGS_FILE: /kraskus-config/settings.json
      KRASKUS_CHTA_CKPOOL_CONFIG: /kraskus-config/ckpool.conf
      KRASKUS_CHTA_RELOAD_REQUEST_FILE: /kraskus-config/reload-request.json
      KRASKUS_CHTA_RELOAD_ACK_FILE: /ckpool-data/reload-ack.json
      KRASKUS_CHTA_RELOAD_TIMEOUT: "20"
      KRASKUS_CHTA_STRATUM_PORT: "3336"

    volumes:
      - ${APP_DATA_DIR}/config:/kraskus-config
      - ${APP_DATA_DIR}/secrets:/run/secrets:ro
      - ${APP_DATA_DIR}/pool:/ckpool-data:ro
    networks:
      - chta
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true


  ui:
    image: ghcr.io/kraskuscrypto/kraskus-chta-solo@sha256:e0cdd6eaddedb9fc620ae07f6e75dea5722a2490779dae33218b050a7ab6a133
    restart: unless-stopped
    depends_on:
      kraskus:
        condition: service_started

    environment:
      CHTA_BACKEND_HOST: kraskus
      CHTA_BACKEND_PORT: "18411"
      CHTA_UI_PORT: "18412"

    volumes:
      - ${APP_DATA_DIR}/data/chta-ui-gateway-v5.py:/qualification/chta-ui-gateway.py:ro
      - ${APP_DATA_DIR}/data/chta-ui-prepaint-v3.js:/qualification/chta-ui-compat-v1.js:ro
      - ${APP_DATA_DIR}/data/chta-ui-compat-v6.js:/app/ui/static/chta-ui-compat-v6.js:ro

    entrypoint:
      - python3
    command:
      - /qualification/chta-ui-gateway.py
    networks:
      - chta
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  chta:
    name: kraskus-chta-solo-v2-qualification
