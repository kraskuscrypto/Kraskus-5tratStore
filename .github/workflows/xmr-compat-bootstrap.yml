name: Publish XMR Compatibility Bootstrap

on:
  push:
    branches:
      - codex/xmr-solo-store-v0.1.2
    paths:
      - ".github/workflows/xmr-compat-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror proven compatibility runtime
        run: |
          SRC="ghcr.io/kraskuscrypto/kraskus-zec-solo@sha256:9ac6eabf4ebed6b0474b9d37d3cc241a6a0259a26b3b3c88df37d00607976db4"
          DST="ghcr.io/kraskuscrypto/kraskus-5trat-xmr-compat-bootstrap:0.1.0"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          docker image inspect --format='{{index .RepoDigests 0}}' "$DST" || true
