name: Build Public XMR Solo Images

on:
  push:
    branches:
      - codex/xmr-solo-store-v0.1
    paths:
      - ".github/workflows/xmr-solo-public-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: kraskuscrypto
  SOURCE_ARTIFACT_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-bfd0-822f-8b6d-b6ebb46629e7/raw?se=2026-08-28T23%3A46%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=ccaf9e6a-f554-5805-a2c2-6cd33deb1cef&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T19%3A32%3A10Z&ske=2026-08-29T19%3A32%3A10Z&sks=b&skv=2026-02-06&sig=DeQBdyExuzPZJI7qZj13ltP5ep9l1I27L88usE%2BpP1w%3D"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: monerod
            image: kraskus-5trat-xmr-monerod
            tag: "0.18.5.1"
            dockerfile: runtime/Dockerfile.monerod
            build_args: |
              MONERO_VERSION=0.18.5.1
              MONERO_SHA256=22a7dda7b0cb699fdd6b7674c3b4a4465b337cc98a54983523b759e1e7cc9958
          - name: adapter
            image: kraskus-5trat-xmr-adapter
            tag: "0.1.0-beta"
            dockerfile: runtime/Dockerfile.adapter
            build_args: ""
          - name: miner-gateway
            image: kraskus-5trat-xmr-miner-gateway
            tag: "0.1.0-beta"
            dockerfile: runtime/Dockerfile.gateway
            build_args: ""
          - name: wallet-api
            image: kraskus-5trat-xmr-wallet-api
            tag: "0.1.0-beta"
            dockerfile: runtime/Dockerfile.wallet-api
            build_args: ""
          - name: ui
            image: kraskus-5trat-xmr-ui
            tag: "0.1.0-beta"
            dockerfile: runtime/Dockerfile.ui
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Download private build-source artifact
        run: |
          mkdir -p /tmp/xmr-source
          curl -fL --retry 3 "$SOURCE_ARTIFACT_URL" -o /tmp/xmr-source.zip
          unzip -q /tmp/xmr-source.zip -d /tmp/xmr-source
          test -f /tmp/xmr-source/runtime/Dockerfile.monerod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: /tmp/xmr-source
          file: /tmp/xmr-source/${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ matrix.tag }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=https://github.com/kraskuscrypto/Kraskus-5tratStore
            org.opencontainers.image.description=Kraskus XMR Solo 5tratumOS runtime component
          provenance: false

      - name: Record digest
        run: |
          echo "${{ matrix.image }}:${{ matrix.tag }}@${{ steps.build.outputs.digest }}"
