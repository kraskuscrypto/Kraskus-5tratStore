map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kraskus/MystNodes shell.
    location = / {
        try_files /index.html =404;
    }

    location = /icon.png {
        try_files /icon.png =404;
    }

    # The REAL local Mysterium Node UI. It remains inside the
    # 5tratumOS app and never sends the browser to :4449 directly.
    location /node/ {
        proxy_pass http://host.docker.internal:4449/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /node;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # Keep upstream UI embeddable in our same-origin Workbench shell.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # Keep cookies usable through the /node prefix.
        proxy_cookie_path / /node/;

        # Common SPA absolute-path fixes.
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter '<base href="/">' '<base href="/node/">';
        sub_filter 'href="/' 'href="/node/';
        sub_filter 'src="/' 'src="/node/';
        sub_filter 'url(/' 'url(/node/';
        sub_filter '"/api/' '"/node/api/';
        sub_filter "'/api/" "'/node/api/";
    }

    # Mysterium APIs requested beneath /node/.
    location /node/api/ {
        proxy_pass http://host.docker.internal:4449/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Common absolute asset/API paths used by SPAs. These fallback routes
    # let the real Node UI continue working even if upstream emits root URLs.
    location ~ ^/(api|assets|static|fonts|images|socket.io|ws)(/|$) {
        proxy_pass http://host.docker.internal:4449;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
}
