server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kraskus/MystNodes launcher
    location = / {
        try_files /index.html =404;
    }

    location = /icon.png {
        try_files /icon.png =404;
    }

    #
    # REAL MYSTERIUM NODE UI
    #
    # Everything under /node/ stays inside the 5tratumOS application.
    #
    location /node/ {
        proxy_pass http://host.docker.internal:4449/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Do not allow upstream frame restrictions to interfere with
        # the 5tratumOS same-origin application proxy.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        proxy_redirect off;

        # Rewrite common absolute asset links so the Myst UI remains
        # underneath /node/ instead of escaping to the app root.
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;

        sub_filter 'href="/' 'href="/node/';
        sub_filter 'src="/' 'src="/node/';
        sub_filter 'url(/' 'url(/node/';
    }

    #
    # Some SPA/API requests may use absolute API paths.
    #
    location /api/ {
        proxy_pass http://host.docker.internal:4449/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        proxy_redirect off;
    }
}
