map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
        sub_filter_once on;
        sub_filter '</body>' '<script src="updater.js"></script></body>';
    }

    location = /icon.png {
        try_files /icon.png =404;
    }

    location = /updater.js {
        try_files /updater.js =404;
        add_header Cache-Control "no-store";
    }

    # One-click updater API. The update-agent has no published host port and
    # is reachable only on the private Docker Compose network through nginx.
    location /update-api/ {
        proxy_pass http://update-agent:33062/cgi-bin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    #
    # Real local MystNodes interface.
    #
    location /node/ {
        proxy_pass http://host.docker.internal:33061/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        proxy_cookie_path / /node/;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;

        sub_filter '<base href="/">' '<base href="/node/">';
        sub_filter 'href="/' 'href="/node/';
        sub_filter 'src="/' 'src="/node/';
    }

    location = /status.json {
        alias /status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

}
