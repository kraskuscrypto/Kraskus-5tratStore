appId: kraskus-zec-solo
status: beta
developer: Kraskus Crypto
notes:
  - Self-contained Kraskus ZEC Solo beta runtime.
  - Includes the Kraskus UI, API/controller, Stratum server, and supervised Zebra service.
  - No pre-existing host development runtime is required.
  - No Docker socket access is required by the application runtime.
  - Payout configuration is applied through the Kraskus UI and shared safely with Zebra.
  - Testnet is the default network for beta qualification.
  - Mainnet activation remains subject to storage safety requirements.
appVersion: 0.2.8-beta

releaseNotes:
  - Redesigned Kraskus ZEC Solo dashboard and first-run experience.
  - Added Divinity hero, Kraskus violet/gold visual system, and animated infrastructure backdrop.
  - Added focused Overview, Workers, Blocks, and Settings views.
  - Added guided payout configuration, storage safety, and mining readiness views.
  - Preserves Docker-free runtime control plane and supervised Zebra payout architecture.

releaseNotes:
  - Fixed static asset loading through the 5tratumOS Workbench proxy.
  - Ships the redesigned Divinity hero and violet/gold Kraskus interface.
  - Includes focused Overview, Workers, Blocks, and Settings workspaces.
