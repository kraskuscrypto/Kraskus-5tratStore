appId: kraskus-bsv-solo
status: proposed
developer: Kraskus Crypto
appVersion: 0.1.0-beta
notes:
  - Initial Bitcoin SV solo-mining application bootstrap.
  - Runtime will use the upstream Bitcoin SV SV Node implementation.
  - Node RPC must remain internal to the application network and must not be exposed publicly.
  - BSV getminingcandidate/submitminingsolution is the preferred mining path; getblocktemplate remains a compatibility fallback.
  - Persistent node data must live under ${APP_DATA_DIR} or a user-selected storage target.
  - Installation must enforce a storage-capacity guard before initial blockchain sync.
  - Native wallet support will be optional and controlled from the Wallet tab.
  - Kraskus solo-mining developer fee target is 1 percent, implemented in the mining/payout layer rather than the node.
  - Runtime image digests, BSV Divinity artwork, and end-to-end node/Stratum qualification are still pending.
releaseNotes:
  - Creates the BSV application definition and implementation plan.
  - Targets SV Node 1.2.2 for initial qualification.
  - Defines BSV-native GMC mining RPCs as the preferred work/submission interface.
