notes: >-
  Proposed 0.1.5-beta package for the Kraskus XMR true-solo appliance.
  Monero P2P TCP 18080 and the restricted miner-facing endpoint TCP 1921
  are intentionally published. monerod RPC, adapter, wallet RPC, and wallet
  API remain on internal application networks. Persistent blockchain,
  wallet, and runtime state use APP_DATA_DIR. A one-shot initializer creates
  the internal view-wallet password on first install without committing or
  exposing it. The app tile uses the approved Divinity XMR icon from the
  Kraskus brand asset vault. Production runtime images are published to GHCR
  and pinned by immutable digests in the store recipe. Fresh install, startup,
  update persistence, and uninstall behavior were previously qualified on
  clean 5tratumOS VM120 hosts. Version 0.1.5-beta keeps the 0.1.4-beta gateway
  and wallet hardening and updates the UI to 0.1.3-beta. The UI adds a full
  mobile compatibility pass across Command, Mining, Blocks, Events, Wallet,
  and Settings, including compact mobile navigation, stacked responsive cards,
  touch-friendly controls, phone-safe wallet receive/send layouts, and a
  dedicated mobile block-ledger card presentation. Command, Mining, Blocks,
  Events, Wallet, and Settings were visually checked at approximately 400px
  width, with no intended horizontal page overflow. The permanent XMR runtime
  qualifier remains passing for gateway allowlists, blocked-request accounting,
  event auditing, mainnet identity, monerod availability, wallet setup/status,
  and wallet sync gating. Full-sync getblocktemplate/XMRig qualification and
  the live wallet send path remain release-gate items before GA. Native custom-
  store update behavior is still dependent on the upstream 5tratumOS dynamic-
  channel fix and is not patched from inside the application.

# 0.1.6-beta release qualification
#
# Promotes the qualified XMR runtime image set from
# Kraskus-Mining-Platform-V2 source commit:
# ca8d5a6c9ced9e1fe8504fa53a44eb50fd1b08c0
#
# Runtime services are pinned to immutable GHCR digests.
# Full-wallet create/restore stores the local wallet password in an
# appliance-local mode-0600 credential used by the automatic developer-fee
# settlement worker. Watch-only wallets remain monitoring-only.
#
# Kraskus XMR Solo charges a 0.25% developer fee only on successfully mined
# block rewards. Settlement occurs automatically after maturity. Miner
# hashrate is never diverted.
#
# The adapter also persists last-known-good node telemetry so the UI can
# remain useful during temporary monerod RPC timeouts.


# 0.1.7-beta release qualification
#
# Updates only the XMR UI image to source commit:
# f69435d4898cfabab4d6e3948f78eef524715fda
#
# The wallet setup method controls are now explicitly presented as tabs.
# Selecting Create New Wallet, Restore Existing Wallet, or Watch-Only switches
# to the corresponding setup panel, updates accessibility state, and focuses
# the first relevant field. The lower action button remains the operation that
# actually creates/restores/configures the wallet.
#
# Monerod, adapter, miner gateway, and wallet API remain pinned to the same
# 0.1.6-beta qualified digests. No wallet, fee-settlement, miner-gateway, or
# daemon behavior changes are introduced by this package revision.
