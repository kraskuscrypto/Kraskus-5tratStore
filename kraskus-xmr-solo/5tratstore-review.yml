notes: >-
  Proposed 0.1.9-beta Dev Store package for the Kraskus XMR true-solo
  appliance. Monero P2P TCP 18080 and the restricted miner endpoint TCP
  1921 are intentionally published. monerod RPC, adapter, wallet RPC, and
  wallet API remain on application networks. Blockchain, wallet, runtime,
  and protected credential state remain below APP_DATA_DIR. Runtime images
  were built from the canonical Kraskus-Crypto-Apps repository and are
  pinned by immutable GHCR digests. The automatic developer fee remains
  exactly 0.25% of successfully mined block rewards after 60-block maturity.
  Pending or temporarily failed fee settlement does not lock mining or user
  wallet sends. Ledger integrity, orphan resolution, retry, prepared-
  transaction recovery, and double-payment prevention remain enforced.
  GitHub Actions build run 33819453243 passed all source validation and five
  linux/amd64 image jobs. This package remains proposed in the Dev Store
  pending client-style VM100 qualification; it has not been promoted to the
  Official Store.

# 0.1.6-beta release qualification
#
# Promotes the qualified XMR runtime image set from
# Kraskus-Mining-Platform-V2 source commit:
# ca8d5a6c9ced9e1fe8504fa53a44eb50fd1b08c0
#
# Runtime services are pinned to immutable GHCR digests.
# Full-wallet create/restore stores the local wallet password in an
# appliance-local mode-0600 credential used by the automatic developer-fee
# settlement worker. Watch-only wallets remain monitoring-only.
#
# Kraskus XMR Solo charges a 0.25% developer fee only on successfully mined
# block rewards. Settlement occurs automatically after maturity. Miner
# hashrate is never diverted.
#
# The adapter also persists last-known-good node telemetry so the UI can
# remain useful during temporary monerod RPC timeouts.


# 0.1.7-beta release qualification
#
# Updates only the XMR UI image to source commit:
# f69435d4898cfabab4d6e3948f78eef524715fda
#
# The wallet setup method controls are now explicitly presented as tabs.
# Selecting Create New Wallet, Restore Existing Wallet, or Watch-Only switches
# to the corresponding setup panel, updates accessibility state, and focuses
# the first relevant field. The lower action button remains the operation that
# actually creates/restores/configures the wallet.
#
# Monerod, adapter, miner gateway, and wallet API remain pinned to the same
# 0.1.6-beta qualified digests. No wallet, fee-settlement, miner-gateway, or
# daemon behavior changes are introduced by this package revision.


# 0.1.8-beta release qualification
#
# Updates only the XMR UI image to source commit:
# 709e92f478ff1981053bd29e4b478e58562b68f0
#
# Corrects the stale hard-coded release labels in the sidebar footer and
# version service card from v0.1.1-beta to v0.1.8-beta. All wallet setup,
# wallet/API, daemon, miner-gateway, fee-settlement, storage, and networking
# behavior remains unchanged from the already-qualified 0.1.7-beta release.

