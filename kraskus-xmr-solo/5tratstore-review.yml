notes: >-
  Proposed 0.1.4-beta package for the Kraskus XMR true-solo appliance.
  Monero P2P TCP 18080 and the restricted miner-facing endpoint TCP 1921
  are intentionally published. monerod RPC, adapter, wallet RPC, and wallet
  API remain on internal application networks. Persistent blockchain,
  wallet, and runtime state use APP_DATA_DIR. A one-shot initializer creates
  the internal view-wallet password on first install without committing or
  exposing it. The app tile uses the approved Divinity XMR icon from the
  Kraskus brand asset vault. Production runtime images are published to GHCR
  and pinned by immutable digests in the store recipe. Fresh install, startup,
  update persistence, and uninstall behavior were previously qualified on
  clean 5tratumOS VM120 hosts. Version 0.1.4-beta updates the miner gateway to
  0.1.1-beta, wallet API to 0.1.1-beta, and UI to 0.1.2-beta. The gateway now
  audits blocked POST endpoints in addition to enforcing the restricted miner
  allowlist. The wallet API keeps setup/health independent from slow sync RPC,
  preserves safe restore-height semantics, migrates legacy wallet discovery
  into durable config, gates legacy view-wallet refresh while the local node
  is behind, and exposes an explicit waiting state instead of surfacing
  hashchain errors during partial sync. The UI receives the finalized Divinity
  XMR hero branding, branded sidebar icon, wallet receive waiting treatment,
  and explicit sync-locked send presentation. The permanent XMR runtime
  qualifier passed for gateway allowlists, blocked-request accounting, event
  auditing, mainnet identity, monerod availability, wallet setup/status, and
  wallet sync gating. Full-sync getblocktemplate/XMRig qualification and the
  live wallet send path remain release-gate items before GA. Native custom-store
  update behavior is still dependent on the upstream 5tratumOS dynamic-channel
  fix and is not patched from inside the application.
