services:
  compat-bootstrap:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-compat-bootstrap:0.1.0@sha256:9ac6eabf4ebed6b0474b9d37d3cc241a6a0259a26b3b3c88df37d00607976db4
    restart: "no"
    user: "0:0"
    entrypoint:
      - python3
      - -c
      - "import os; exec(os.environ['COMPAT_SCRIPT'])"
    environment:
      COMPAT_SCRIPT: |
        import json, shutil, subprocess, time
        from pathlib import Path

        CLI = Path('/host/5tratumos')
        STORE = Path('/host/store.json')
        DATA = Path('/compat-data')
        D = chr(36)
        MARK_UPDATE = '# KRASKUS_DYNAMIC_CUSTOM_UPDATE_V2'
        MARK_META = '# KRASKUS_DYNAMIC_CUSTOM_META_V2'

        def out(msg):
            print(msg, flush=True)

        def kraskus_store_present():
            if not STORE.is_file():
                return False
            try:
                cfg = json.loads(STORE.read_text(encoding='utf-8'))
                custom = cfg.get('custom', {}) if isinstance(cfg, dict) else {}
                for value in custom.values() if isinstance(custom, dict) else []:
                    if not isinstance(value, dict):
                        continue
                    url = str(value.get('url') or '').lower()
                    if 'kraskuscrypto/kraskus-5tratstore' in url:
                        return True
            except Exception:
                return False
            return False

        def dynamic_supported(text):
            return (
                (MARK_UPDATE in text and MARK_META in text)
                or (
                    'custom*)' in text
                    and 'custom channel is not synced:' in text
                    and '^custom[-_a-z0-9]' in text
                )
            )

        def repair_text(text):
            lines = text.splitlines(keepends=True)
            stale_update = 'main|dev|global|custom1|custom2) ;;'
            stale_meta = 'main|dev|global|custom1|custom2) meta_ch="' + D + '{meta_channel}" ;;'

            update_hits = [i for i, line in enumerate(lines) if line.strip() == stale_update]
            meta_hits = [i for i, line in enumerate(lines) if line.strip() == stale_meta]

            if len(update_hits) != 1 or len(meta_hits) != 1:
                return None

            ui = update_hits[0]
            mi = meta_hits[0]
            if ui >= mi:
                return None

            uindent = lines[ui][:len(lines[ui]) - len(lines[ui].lstrip())]
            mindent = lines[mi][:len(lines[mi]) - len(lines[mi].lstrip())]

            update_replacement = [
                uindent + MARK_UPDATE + '\n',
                uindent + 'main|dev|global|custom1|custom2)\n',
                uindent + '  ;;\n',
                uindent + 'custom*)\n',
                uindent + '  [[ "' + D + '{ch}" =~ ^custom[-_a-z0-9]{0,48}$ ]] ||\n',
                uindent + '    die "invalid channel: ' + D + '{ch}"\n',
                uindent + '  [ -d "' + D + '{ROOT_DIR}/store/' + D + '{ch}" ] ||\n',
                uindent + '    die "custom channel is not synced: ' + D + '{ch}"\n',
                uindent + '  ;;\n',
            ]

            meta_replacement = [
                mindent + MARK_META + '\n',
                mindent + 'main|dev|global|custom1|custom2)\n',
                mindent + '  meta_ch="' + D + '{meta_channel}"\n',
                mindent + '  ;;\n',
                mindent + 'custom*)\n',
                mindent + '  if [[ "' + D + '{meta_channel}" =~ ^custom[-_a-z0-9]{0,48}$ ]] &&\n',
                mindent + '     [ -d "' + D + '{ROOT_DIR}/store/' + D + '{meta_channel}" ]; then\n',
                mindent + '    meta_ch="' + D + '{meta_channel}"\n',
                mindent + '  fi\n',
                mindent + '  ;;\n',
            ]

            lines[ui:ui+1] = update_replacement
            mi += len(update_replacement) - 1
            lines[mi:mi+1] = meta_replacement
            return ''.join(lines)

        if not CLI.is_file():
            out('KRASKUS_CUSTOM_CHANNEL_BOOTSTRAP=SKIP_NO_HOST_CLI')
            raise SystemExit(0)

        text = CLI.read_text(encoding='utf-8')
        if dynamic_supported(text):
            out('KRASKUS_CUSTOM_CHANNEL_BOOTSTRAP=ALREADY_SUPPORTED')
            raise SystemExit(0)

        if not kraskus_store_present():
            out('KRASKUS_CUSTOM_CHANNEL_BOOTSTRAP=SKIP_STORE_NOT_CONFIRMED')
            raise SystemExit(0)

        repaired = repair_text(text)
        if repaired is None:
            out('KRASKUS_CUSTOM_CHANNEL_BOOTSTRAP=SKIP_UNKNOWN_CLI_LAYOUT')
            raise SystemExit(0)

        DATA.mkdir(parents=True, exist_ok=True)
        stamp = time.strftime('%Y%m%d-%H%M%S', time.gmtime())
        backup = DATA / ('5tratumos.pre-xmr-compat-' + stamp)
        shutil.copy2(CLI, backup)
        CLI.write_text(repaired, encoding='utf-8')

        check = subprocess.run(['/bin/bash','-n',str(CLI)], capture_output=True, text=True)
        if check.returncode != 0:
            shutil.copy2(backup, CLI)
            out('KRASKUS_CUSTOM_CHANNEL_BOOTSTRAP=FAIL_SYNTAX_RESTORED')
            raise SystemExit(1)

        final = CLI.read_text(encoding='utf-8')
        if not dynamic_supported(final):
            shutil.copy2(backup, CLI)
            out('KRASKUS_CUSTOM_CHANNEL_BOOTSTRAP=FAIL_VERIFY_RESTORED')
            raise SystemExit(1)

        out('KRASKUS_CUSTOM_CHANNEL_BOOTSTRAP=PASS')
        out('BACKUP=' + str(backup))
    volumes:
      - /usr/local/bin/5tratumos:/host/5tratumos
      - /etc/5tratumos/store.json:/host/store.json:ro
      - ${APP_DATA_DIR}/compat:/compat-data
    security_opt:
      - no-new-privileges:true

  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080

  wallet-init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /blockchain /wallets /runtime
        chown 1000:1000 /blockchain /wallets /runtime
        if [ ! -s /wallets/.view-password ]; then
          umask 077
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > /wallets/.view-password
          printf '\n' >> /wallets/.view-password
          chown 1000:1000 /wallets/.view-password
          chmod 600 /wallets/.view-password
        fi
    volumes:
      - ${APP_DATA_DIR}/blockchain:/blockchain
      - ${APP_DATA_DIR}/wallets:/wallets
      - ${APP_DATA_DIR}/runtime:/runtime
    security_opt:
      - no-new-privileges:true

  monerod:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod:0.18.5.1@sha256:1c88dce0ffcdaf06c1914a78445ba9121fbc7d4b310b42f963281715350ba518
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      wallet-init:
        condition: service_completed_successfully
    command:
      - --data-dir=/data
      - --non-interactive
      - --prune-blockchain
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=18080
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --no-igd
      - --log-level=0
    ports:
      - "18080:18080/tcp"
    volumes:
      - ${APP_DATA_DIR}/blockchain:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":"0","method":"get_info"}'
          http://127.0.0.1:18081/json_rpc >/dev/null
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 2m
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_public
      - xmr_private
      - xmr_wallet

  wallet-view-rpc:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod:0.18.5.1@sha256:1c88dce0ffcdaf06c1914a78445ba9121fbc7d4b310b42f963281715350ba518
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/monero-wallet-rpc"]
    command:
      - --wallet-dir=/wallets
      - --daemon-address=http://monerod:18081
      - --trusted-daemon
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18083
      - --confirm-external-bind
      - --disable-rpc-login
      - --log-level=0
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      monerod:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet

  wallet-spend-rpc:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-monerod:0.18.5.1@sha256:1c88dce0ffcdaf06c1914a78445ba9121fbc7d4b310b42f963281715350ba518
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/monero-wallet-rpc"]
    command:
      - --wallet-dir=/wallets
      - --daemon-address=http://monerod:18081
      - --trusted-daemon
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18084
      - --confirm-external-bind
      - --disable-rpc-login
      - --log-level=0
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      monerod:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet

  adapter:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-adapter:0.1.0-beta@sha256:2d3558cfbdd04c62b2bd276bedc24e54b61f8b31cafc28bb2978ccb27b0e5435
    restart: unless-stopped
    depends_on:
      monerod:
        condition: service_healthy
    environment:
      KRASKUS_XMR_ADAPTER_HOST: "0.0.0.0"
      KRASKUS_XMR_ADAPTER_PORT: "18410"
      KRASKUS_XMR_RPC_URL: "http://monerod:18081/json_rpc"
      KRASKUS_XMR_DIFFICULTY_LOG: "/runtime/network-difficulty.jsonl"
      KRASKUS_XMR_DIFFICULTY_SAMPLE_SECONDS: "60"
      KRASKUS_XMR_DIFFICULTY_MAX_ROWS: "1440"
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18410/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_private
      - xmr_api

  gateway:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-miner-gateway:0.1.0-beta@sha256:292af7e3e06e4ce304ffd7a3f256ca06600ccc04c45f915a723e5b77087036e8
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      monerod:
        condition: service_healthy
    environment:
      KRASKUS_XMR_GATEWAY_HOST: "0.0.0.0"
      KRASKUS_XMR_GATEWAY_PORT: "1921"
      KRASKUS_XMR_MONEROD_BASE: "http://monerod:18081"
      KRASKUS_XMR_SUBMISSION_LOG: "/runtime/block-submissions.jsonl"
      KRASKUS_XMR_EVENT_LOG: "/runtime/events.jsonl"
    volumes:
      - ${APP_DATA_DIR}/runtime:/runtime
    ports:
      - "1921:1921/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1921/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_private
      - xmr_api

  wallet-api:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-wallet-api:0.1.0-beta@sha256:76aa908e3b6c9ea52a0a419502af71cc1bf5251367e56f86ef60161fda012245
    restart: unless-stopped
    user: "1000:1000"
    environment:
      KRASKUS_XMR_WALLET_API_HOST: "0.0.0.0"
      KRASKUS_XMR_WALLET_API_PORT: "18420"
      KRASKUS_XMR_VIEW_RPC: "http://wallet-view-rpc:18083/json_rpc"
      KRASKUS_XMR_SPEND_RPC: "http://wallet-spend-rpc:18084/json_rpc"
      KRASKUS_XMR_VIEW_WALLET: "kraskus-xmr-solo-view"
      KRASKUS_XMR_VIEW_PASSWORD_FILE: "/wallets/.view-password"
      KRASKUS_XMR_SPEND_WALLET: "kraskus-xmr-solo"
      KRASKUS_XMR_NODE_STATUS: "http://adapter:18410/api/status"
      KRASKUS_XMR_MONEROD_RPC: "http://monerod:18081/json_rpc"
      KRASKUS_XMR_WALLET_SEND_LOG: "/runtime/wallet-sends.jsonl"
      KRASKUS_XMR_EVENT_LOG: "/runtime/events.jsonl"
      KRASKUS_XMR_WALLET_CONFIG: "/runtime/wallet-config.json"
    volumes:
      - ${APP_DATA_DIR}/wallets:/wallets
      - ${APP_DATA_DIR}/runtime:/runtime
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      wallet-view-rpc:
        condition: service_started
      wallet-spend-rpc:
        condition: service_started
      adapter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18420/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_wallet
      - xmr_api

  ui:
    image: ghcr.io/kraskuscrypto/kraskus-5trat-xmr-ui:0.1.1-beta@sha256:06a66496eff08631bd80534049ec89975c857405cd268dbf16c6e74f91c16451
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/health >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - xmr_api

networks:
  xmr_public:
    driver: bridge
  xmr_private:
    driver: bridge
    internal: true
  xmr_api:
    driver: bridge
  xmr_wallet:
    driver: bridge
    internal: true
