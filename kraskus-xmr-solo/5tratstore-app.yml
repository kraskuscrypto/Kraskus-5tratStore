id: kraskus-xmr-solo
name: Kraskus XMR Solo
tagline: Monero full node, wallet, and true solo mining appliance
description: >-
  Kraskus XMR Solo turns 5tratumOS into a self-contained Monero
  node, wallet, and true solo mining appliance. It provides chain
  synchronization, direct daemon mining, block submission tracking,
  operational events, wallet receive/send workflows, and appliance
  settings through one local interface. The miner endpoint exposes
  only the Monero daemon methods required for solo mining. Wallet
  state and blockchain data remain in persistent 5tratumOS app storage.
  An automatic 1% developer fee applies only to successfully mined block
  rewards after 60-block maturity; miner hashrate is never diverted.
version: 0.1.9-beta
category: Mining
developer: Kraskus Crypto
website: https://kraskuscrypto.com/
repo: https://github.com/kraskuscrypto/Kraskus-Crypto-Apps
support: https://kraskuscrypto.com/
icon: assets/icon.png
port: 33065
path: /
uiMode: proxy

services:
  app_proxy:
    environment:
      APP_HOST: ui
      APP_PORT: 8080
